<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline Formatting Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #fdfdfd;
      color: #333;
    }
    mark {
      background-color: #ffeb3b;
    }
  </style>
</head>
<body>
  <p>
    <strong>Web design</strong> is both an art and a science.<br>
    It requires <em>creativity</em> to craft beautiful layouts and <mark>precision</mark> to ensure accessibility.<br>
    Every detail matters — from typography to responsiveness. <small>(Last updated: November 2025)</small>
  </p>
</body>
</html>
