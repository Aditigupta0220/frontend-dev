<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Span Highlight Example</title>
  <style>
    .highlight-skill {
      background-color: #d1f0ff;
      font-weight: bold;
    }
    .highlight-design {
      background-color: #ffe0b2;
      font-style: italic;
    }
    .highlight-learning {
      background-color: #e1bee7;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>
    I enjoy <span class="highlight-skill">coding</span> because it challenges my mind and allows me to build useful tools.
    Designing <span class="highlight-design">user-friendly interfaces</span> is especially rewarding, and I'm currently diving into
    <span class="highlight-learning">machine learning</span> to expand my skill set.
  </p>
</body>
</html>
